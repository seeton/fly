<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハエ脳ブラウザ</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root{
    --bg:#0a0b0d; --panel:#131519; --panel2:#1a1d23; --line:#282c34;
    --fg:#e6e8ea; --muted:#8b929c; --accent:#ff5a4d; --cyan:#22d3ee;
    --amber:#ff9f0a; --green:#2be06a; --blue:#4da3ff; --yellow:#ffe600;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 "Segoe UI","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;
       height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;
         align-items:baseline;gap:14px;flex-shrink:0}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.02em}
  header .sub{color:var(--muted);font-size:12px}
  main{flex:1;display:flex;min-height:0}
  #side{width:340px;flex-shrink:0;border-right:1px solid var(--line);
        overflow-y:auto;padding:12px;background:var(--panel)}
  #view{flex:1;display:flex;flex-direction:column;min-width:0}
  #plot{flex:1;min-height:0}
  #bar{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;
       gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel2)}
  input,select,button{font:inherit;background:var(--panel2);color:var(--fg);
       border:1px solid var(--line);border-radius:6px;padding:6px 10px}
  input:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  button{cursor:pointer}
  button:hover{border-color:var(--muted)}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #q{width:100%;margin-bottom:8px}
  .row{display:flex;justify-content:space-between;gap:8px;padding:4px 7px;
       border-radius:5px;cursor:pointer;font-size:13px}
  .row:hover{background:var(--panel2)}
  .row .n{color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0}
  .sect{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
  .sect h3{font-size:11px;color:var(--muted);margin:0 0 6px;font-weight:600;
           letter-spacing:.08em;text-transform:uppercase}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);
       border-radius:4px;padding:1px 7px;font-size:11px;color:var(--muted);margin:2px 3px 2px 0}
  .big{font-size:22px;font-weight:600;letter-spacing:.01em}
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 0}
  .kv b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
  #status{color:var(--muted);font-size:12px;margin-left:auto}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--muted);align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
  #info{padding:8px 12px;border-top:1px solid var(--line);background:var(--panel2);
        font-size:12px;color:var(--muted);min-height:34px;max-height:110px;overflow-y:auto}
  #info b{color:var(--fg)}
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);
         border-radius:10px;padding:0;max-width:880px}
  dialog header{border-bottom:1px solid var(--line)}
  .vids{padding:14px;display:grid;gap:14px}
  video{width:100%;border-radius:8px;background:#000}
  .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--muted);
        border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;
        vertical-align:-1px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <h1>ハエ脳ブラウザ</h1>
  <span class="sub">Male CNS v1.0 — 211,577 ボディ / 1億5185万接続 / 3億1183万シナプス</span>
</header>

<main>
  <div id="side">
    <input id="q" placeholder="細胞型を検索 (DNp01, TTMn, LC4, pC1 …)" autocomplete="off">
    <div id="results"></div>
    <div id="detail"></div>
  </div>

  <div id="view">
    <div id="bar">
      <button id="bSkel" class="on">骨格</button>
      <button id="bSyn">シナプス</button>
      <input id="partner" placeholder="接触相手 (例 TTMn)" style="width:150px">
      <button id="bContact">接触点</button>
      <span style="width:12px"></span>
      <button id="bMotor">運動ニューロンまで何段？</button>
      <input id="dst" placeholder="経路の行き先" style="width:130px">
      <button id="bPath">経路探索</button>
      <button id="bVid">動画</button>
      <span id="status"></span>
    </div>
    <div class="legend" style="padding:6px 12px">
      <span><i class="dot" style="background:var(--accent)"></i>選択した細胞</span>
      <span><i class="dot" style="background:var(--green)"></i>相手 / 経路</span>
      <span><i class="dot" style="background:var(--cyan)"></i>入力シナプス</span>
      <span><i class="dot" style="background:var(--amber)"></i>出力シナプス</span>
      <span><i class="dot" style="background:var(--yellow)"></i>接触点</span>
    </div>
    <div id="plot"></div>
    <div id="info">細胞型を選ぶと 3D で表示します。</div>
  </div>
</main>

<dialog id="vidDlg">
  <header><h1>シミュレーション動画</h1><span class="sub">out/ から配信</span></header>
  <div class="vids" id="vids"></div>
  <div style="padding:0 14px 14px"><button onclick="vidDlg.close()">閉じる</button></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const state = {type:null, skel:true, syn:false, contact:false, detail:null};

const LAYOUT = {
  paper_bgcolor:'#0a0b0d', plot_bgcolor:'#0a0b0d',
  font:{color:'#e6e8ea', size:11},
  margin:{l:0,r:0,t:0,b:0},
  showlegend:true,
  legend:{bgcolor:'rgba(0,0,0,.45)', x:0, y:1},
  scene:{ aspectmode:'data', bgcolor:'#0a0b0d',
    xaxis:{visible:false}, yaxis:{visible:false}, zaxis:{visible:false} }
};

function status(msg, busy){
  $('#status').innerHTML = busy ? '<span class="spin"></span>'+msg : (msg||'');
}
function info(html){ $('#info').innerHTML = html; }

async function api(path){
  const r = await fetch(path);
  if(!r.ok){ throw new Error((await r.json().catch(()=>({detail:r.statusText}))).detail); }
  return r.json();
}

// ---- 検索 ----
let timer;
$('#q').addEventListener('input', e => {
  clearTimeout(timer);
  timer = setTimeout(()=>doSearch(e.target.value), 180);
});

async function doSearch(q){
  const d = await api('/api/search?q='+encodeURIComponent(q));
  $('#results').innerHTML = d.results.map(r =>
    `<div class="row" onclick="select('${r.type}')">
       <span>${r.type}<span class="tag">${r.superclass||''}</span></span>
       <span class="n">${r.n}</span></div>`).join('')
    + (d.total > d.results.length ? `<div class="kv" style="padding-top:6px">全 ${d.total} 型中 ${d.results.length} 件</div>` : '');
}

// ---- 細胞型を選ぶ ----
async function select(t){
  state.type = t;
  status('読み込み中…', true);
  try{
    const d = await api('/api/type/'+encodeURIComponent(t));
    state.detail = d;
    renderDetail(d);
    await redraw();
    status('');
  }catch(e){ status('エラー: '+e.message); }
}

function renderDetail(d){
  const tbl = (rows, dir) => rows.map(r =>
    `<div class="row" onclick="select('${r.type}')">
       <span>${r.type}<span class="tag">${r.superclass}</span></span>
       <span class="n">${r.weight.toLocaleString()}</span></div>`).join('');
  $('#detail').innerHTML = `
    <div class="sect">
      <div class="big">${d.type}</div>
      <div>${d.superclass ? `<span class="tag">${d.superclass}</span>`:''}
           ${d.dimorphism ? `<span class="tag" style="color:var(--accent)">${d.dimorphism}</span>`:''}</div>
      <div class="kv"><span>ボディ数</span><b>${d.n_bodies}</b></div>
      <div class="kv"><span>出力シナプス</span><b>${d.total_out.toLocaleString()}</b></div>
      <div class="kv"><span>入力シナプス</span><b>${d.total_in.toLocaleString()}</b></div>
      ${d.flywireType ? `<div class="kv"><span>FlyWire(メス)</span><b>${d.flywireType}</b></div>`:''}
      ${d.hemibrainType ? `<div class="kv"><span>hemibrain</span><b>${d.hemibrainType}</b></div>`:''}
    </div>
    <div class="sect"><h3>下流 — 出力先</h3>${tbl(d.downstream)}</div>
    <div class="sect"><h3>上流 — 入力元</h3>${tbl(d.upstream)}</div>`;
}

// ---- 3D 描画 ----
async function redraw(){
  if(!state.type) return;
  const traces = [];
  const d = state.detail;

  if(state.skel){
    const s = await api('/api/skeletons?bodies='+d.bodies.slice(0,8).join(','));
    s.neurons.forEach((n,i) => traces.push({
      type:'scatter3d', mode:'lines', x:n.x, y:n.y, z:n.z,
      line:{color:'#ff5a4d', width:3}, name: i===0 ? d.type : '',
      showlegend: i===0, hoverinfo:'name'
    }));
  }

  const partner = $('#partner').value.trim();
  if(state.contact && partner){
    try{
      const p = await api('/api/type/'+encodeURIComponent(partner));
      const s = await api('/api/skeletons?bodies='+p.bodies.slice(0,4).join(','));
      s.neurons.forEach((n,i) => traces.push({
        type:'scatter3d', mode:'lines', x:n.x, y:n.y, z:n.z,
        line:{color:'#2be06a', width:3}, name: i===0 ? partner : '',
        showlegend: i===0, hoverinfo:'name'
      }));
    }catch(e){ /* 相手が見つからないだけ */ }
  }

  if(state.syn || (state.contact && partner)){
    status('シナプス 6.8GB を走査中…', true);
    const url = '/api/synapses?type='+encodeURIComponent(state.type)
              + (partner && state.contact ? '&partner='+encodeURIComponent(partner) : '');
    const sy = await api(url);
    if(state.syn){
      traces.push({type:'scatter3d', mode:'markers', x:sy.post.x, y:sy.post.y, z:sy.post.z,
        marker:{size:1.6, color:'#22d3ee', opacity:.45}, name:`入力 ${sy.n_post.toLocaleString()}`});
      traces.push({type:'scatter3d', mode:'markers', x:sy.pre.x, y:sy.pre.y, z:sy.pre.z,
        marker:{size:1.6, color:'#ff9f0a', opacity:.45}, name:`出力 ${sy.n_pre.toLocaleString()}`});
    }
    if(sy.contact){
      traces.push({type:'scatter3d', mode:'markers', x:sy.contact.x, y:sy.contact.y, z:sy.contact.z,
        marker:{size:6, color:'#ffe600', line:{width:1,color:'#000'}},
        name:`${state.type}→${partner} ${sy.n_contact}`});
      info(`<b>${state.type} → ${partner}</b> の接触は <b>${sy.n_contact}</b> シナプス。`
         + ` 領域: ${Object.entries(sy.contact_rois||{}).map(([k,v])=>`${k} (${v})`).join(', ')||'—'}`);
    } else if(state.syn){
      info(`<b>${state.type}</b> のシナプス ${(sy.n_pre+sy.n_post).toLocaleString()} 個 —`
         + ` 入力 ${sy.n_post.toLocaleString()} / 出力 ${sy.n_pre.toLocaleString()}。`
         + ` 主な領域: ${Object.entries(sy.rois).map(([k,v])=>`${k} (${v})`).join(', ')}`);
    }
    status('');
  }

  Plotly.react($('#plot'), traces, LAYOUT, {responsive:true, displaylogo:false});
}

// ---- ボタン ----
function toggle(btn, key){
  $(btn).addEventListener('click', async () => {
    state[key] = !state[key];
    $(btn).classList.toggle('on', state[key]);
    status('', false);
    await redraw().catch(e => status('エラー: '+e.message));
  });
}
toggle('#bSkel','skel'); toggle('#bSyn','syn'); toggle('#bContact','contact');

$('#bMotor').addEventListener('click', async () => {
  if(!state.type) return;
  status('グラフを探索中…', true);
  try{
    const d = await api('/api/motor-reach?type='+encodeURIComponent(state.type));
    const steps = Object.entries(d.by_step).map(([k,v])=>`${k}段: ${v}`).join(' / ');
    info(`<b>${state.type}</b> から weight≥10 の接続で 4 段以内に届く運動ニューロン: `
       + `<b>${d.n_reached.toLocaleString()}</b> / ${d.n_motor_total.toLocaleString()} 個。 ${steps}<br>`
       + `最短: ${d.nearest.slice(0,6).map(n=>`${n.type}(${n.steps}段)`).join(', ')}`);
    status('');
  }catch(e){ status('エラー: '+e.message); info(e.message); }
});

$('#bPath').addEventListener('click', async () => {
  const dst = $('#dst').value.trim();
  if(!state.type || !dst) return;
  status('経路を探索中…', true);
  try{
    const d = await api(`/api/path?src=${encodeURIComponent(state.type)}&dst=${encodeURIComponent(dst)}`);
    const chain = d.path.map((n,i) =>
      `<b>${n.type}</b><span class="tag">${n.superclass}</span>`
      + (i < d.weights.length ? ` —${d.weights[i]}シナプス→ ` : '')).join('');
    info(`経路 (${d.path.length-1} ステップ): ${chain}`);
    const s = await api('/api/skeletons?bodies='+d.path.map(n=>n.body).join(','));
    const colors = ['#4da3ff','#ff5a4d','#ffb648','#2be06a','#22d3ee','#c58bff'];
    Plotly.react($('#plot'), s.neurons.map((n,i)=>({
      type:'scatter3d', mode:'lines', x:n.x, y:n.y, z:n.z,
      line:{color:colors[i%colors.length], width:4}, name:`${i+1}. ${n.type}`
    })), LAYOUT, {responsive:true, displaylogo:false});
    status('');
  }catch(e){ status(''); info('経路なし: '+e.message); }
});

$('#bVid').addEventListener('click', async () => {
  const d = await api('/api/videos');
  const names = {
    'flight.mp4':'飛行 — 200Hzで羽ばたき、体重の1.16倍の揚力で上昇 (60倍スロー)',
    'flight_plain.mp4':'比較: MuJoCo既定の空力係数だと0.79倍しか出ず落ちる',
    'escape_takeoff.mp4':'跳躍 — DNp01発火 → 中脚伸展 → 体長の73%浮く',
    'fly_walk.mp4':'歩行 — 三脚歩行 (素朴なサイン波の歩容)'
  };
  const order = ['flight.mp4','escape_takeoff.mp4','fly_walk.mp4','flight_plain.mp4'];
  d.videos.sort((a,b)=>(order.indexOf(a.name)+9)%9 - (order.indexOf(b.name)+9)%9);
  $('#vids').innerHTML = d.videos.map(v =>
    `<div><div style="margin-bottom:6px">${names[v.name]||v.name}
       <span class="tag">${v.size_mb} MB</span></div>
     <video src="/video/${v.name}" controls loop></video></div>`).join('')
    || '<div>動画がありません。scripts/11_escape_takeoff.py を実行してください。</div>';
  $('#vidDlg').showModal();
});

// 初期表示
doSearch('');
select('DNp01');
</script>
</body>
</html>
